# Configuration exercising many directives, for comparing how different
# builds parse it (test/compat/interfaces.py --only config).  Not a useful
# station configuration.  Syntax from the Dire Wolf User Guide (1.8).
#
# ADEVICE, ARATE, KISSPORT and AGWPORT are supplied by the test harness.

ACHANNELS 2

CHANNEL 0
MYCALL N0CALL-1
MODEM 1200 E+ /3
FIX_BITS 1 AX25
TXDELAY 30
TXTAIL 10
PERSIST 63
SLOTTIME 10
DWAIT 0
FULLDUP OFF
DTMF

CHANNEL 1
MYCALL N0CALL-2
MODEM 9600
IL2PTX 1
FRACK 4
RETRY 10
PACLEN 128
MAXFRAME 4
EMAXFRAME 30
MAXV22 3

DIGIPEAT 0 0 ^WIDE[3-7]-[1-7]$|^TEST$ ^WIDE[12]-[12]$ TRACE
DIGIPEAT 0 1 ^WIDE[12]-[12]$ ^WIDE[12]-[12]$ TRACE
DIGIPEAT 1 0 ^WIDE[12]-[12]$ ^WIDE[12]-[12]$ TRACE
DIGIPEAT 1 1 ^WIDE[12]-[12]$ ^WIDE[12]-[12]$
FILTER 0 1 t/m
FILTER 1 0 ( t/p & d/WIDE1-1 ) | t/wn
DEDUPE 30
CDIGIPEAT 0 0
CFILTER 0 0 t/m

IGSERVER 127.0.0.1:1
IGLOGIN N0CALL-1 13023
IGTXVIA 0 WIDE1-1,WIDE2-1
IGFILTER m/50
IGTXLIMIT 6 10
IGMSP 1
SATGATE 600

PBEACON delay=1 every=30 overlay=S symbol="digi" lat=42^37.14N long=71^20.83W power=50 height=20 gain=4 comment="Kitchen sink"
PBEACON sendto=IG delay=0:30 every=60:00 symbol="igate" overlay=R lat=42^37.14N long=71^20.83W
OBEACON delay=0:15 every=10 objname="LEADER" symbol=/> lat=49^03.50N long=72^01.75W comment="Object"
CBEACON delay=2 every=15 info=">Custom status"
IBEACON sendto=0 delay=1 every=60 via=WIDE1-1
SMARTBEACONING 60 1:30 5 15:00 0:15 30 255

TTPOINT  B01  37^55.37N  81^7.86W
TTVECTOR  B5bbbddd  37^55.37N  81^7.86W  0.01  mi
TTGRID   Byyyxxx    37^50.00N  81^00.00W  37^59.99N  81^09.99W
TTUTM  B6xxxyyyz  19T  10  300000  4720000
TTCORRAL   37^55.50N  81^7.00W  0^0.02N
TTMACRO  xx1yy  B9xx*AB166*AA2B4C5B3B0Ayy
TTOBJ 0 APP

NOXID
V20 N0CALL-9
LOGDIR /tmp
